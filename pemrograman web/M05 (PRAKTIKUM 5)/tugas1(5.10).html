<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Konsep Dasar JavaScript - Seleksi Nilai</title>
</head>
<body>
  <h2>Program Seleksi Nilai Mahasiswa</h2>
  <p>Masukkan nilai antara 0 sampai 100 untuk mengetahui hasil kelulusan.</p>

  <input type="button" value="Cek Nilai" onclick="cekNilai()">

  <h3>Hasil:</h3>
  <div id="hasil"></div>

  <script type="text/javascript">
    function cekNilai() {
      var input = prompt("Masukkan nilai (0 - 100):");
      var nilai = parseInt(input);
      var hasil = document.getElementById("hasil");
      var huruf, ket;

      // Validasi input
      if (isNaN(nilai)) {
        hasil.innerHTML = "Input tidak valid. Harap masukkan angka.";
        hasil.style.color = "black";
        return;
      }
      if (nilai < 0 || nilai > 100) {
        hasil.innerHTML = "Nilai harus berada antara 0 hingga 100.";
        hasil.style.color = "black";
        return;
      }

      // Seleksi nilai menggunakan if-else
      if (nilai >= 80 && nilai <= 100) {
        huruf = "A";
        ket = "Lulus";
      } else if (nilai >= 75) {
        huruf = "AB";
        ket = "Lulus";
      } else if (nilai >= 70) {
        huruf = "B";
        ket = "Lulus";
      } else if (nilai >= 65) {
        huruf = "BC";
        ket = "Lulus";
      } else if (nilai >= 60) {
        huruf = "C";
        ket = "Lulus";
      } else if (nilai >= 50) {
        huruf = "D";
        ket = "Tidak Lulus";
      } else {
        huruf = "E";
        ket = "Tidak Lulus";
      }

      // Ubah warna tulisan sesuai hasil
      if (ket == "Lulus") {
        hasil.style.color = "green";
      } else {
        hasil.style.color = "red";
      }

      // Tampilkan hasil
      hasil.innerHTML = 
        "Nilai Mahasiswa: " + nilai + "<br>" +
        "Grade: " + huruf + "<br>" +
        "Keterangan: " + ket;
    }
  </script>
</body>
</html>
